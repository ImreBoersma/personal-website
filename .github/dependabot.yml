# Dependabot version updates — https://docs.github.com/code-security/dependabot
# Security updates are enabled separately under Settings → Code security.
version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      # One PR per week for every minor/patch bump (prod + dev). These are
      # auto-merged by the CI workflow once the build passes, so they need no
      # review. Majors are intentionally excluded and get their own PR.
      npm-non-major:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in the workflows below
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-non-major:
        update-types:
          - "minor"
          - "patch"
